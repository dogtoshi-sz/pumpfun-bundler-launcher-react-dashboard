# Railway Configuration for API Server
# 
# 🔒 SECURITY: This server NEVER receives private keys
# All signing happens client-side in the browser
#
# Required Environment Variables (set in Railway dashboard):
# - HELIUS_RPC_URL: Your Helius RPC endpoint
# - NODE_ENV: production
#
# ⚠️ DO NOT SET:
# - PRIVATE_KEY (not needed - keys stay in browser)
# - Any wallet secret keys

[build]
builder = "nixpacks"
buildCommand = "npm install"

[deploy]
startCommand = "node control-panel-server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3001
