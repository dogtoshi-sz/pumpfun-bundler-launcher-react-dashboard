# Railway Configuration for Frontend
#
# 🔒 SECURITY: All wallet keys are stored in browser localStorage
# Keys NEVER leave the user's browser
#
# Required Environment Variables (set in Railway dashboard):
# - VITE_API_URL: Your API server URL (e.g., https://your-api.railway.app)

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "serve dist -s -l $PORT"
